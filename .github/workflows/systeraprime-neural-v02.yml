name: SysteraPrime Voces Neurales V02
on:
  push:
    paths:
      - 'tesis_voice_batch_v02.py'
      - '.github/workflows/systeraprime-neural-v02.yml'
  workflow_dispatch:
jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install kokoro-onnx==0.6.1 soundfile numpy
      - name: Modelos
        run: |
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Crear 20 narraciones neutras en español
        run: python tesis_voice_batch_v02.py
      - name: Verificar
        run: |
          test "$(find tesis_voice_v02 -name 'VOZ_*.wav' | wc -l)" -eq 20
          python - <<'PY'
          import json
          m=json.load(open('tesis_voice_v02/manifest.json'))
          assert len(m)==20
          assert all(x['duration_s']>11 for x in m)
          print('OK 20 voces >= 11 segundos')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SYSTERAPRIME_VOCES_NEURALES_V02
          path: tesis_voice_v02/AUDIOS_NEURALES_SYSTERAPRIME_V02.zip
          retention-days: 7
          if-no-files-found: error

name: SysTera Social cada 8 horas
on:
  schedule:
    - cron: '0 5,13,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: systera-social
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu
      - run: python -m pip install requests pillow google-api-python-client google-auth
      - name: Preparar y, si procede, publicar
        env:
          RUN_PUBLISH: ${{ vars.RUN_PUBLISH || 'false' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          YOUTUBE_TARGET_CHANNEL_ID: ${{ secrets.YOUTUBE_TARGET_CHANNEL_ID }}
          YOUTUBE_OAUTH_TOKEN_JSON_BASE64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_BASE64 }}
        run: python systera-social/runner.py
      - name: Conservar registros antirrepetición
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add systera-social/state.json
          git diff --cached --quiet || (git commit -m "SysTera ciclo verificado [skip ci]" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systera-ciclo-${{ github.run_number }}
          path: systera-social/output/
          retention-days: 30

name: SysTera - preparar cada 8 horas
on:
  schedule:
    - cron: '17 5,13,21 * * *'  # 00:17, 08:17 y 16:17 PET (UTC-5); evita hora punta
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/systera-social-8h.yml'
      - 'systera-social/src/**'
      - 'systera-social/config/**'
      - 'systera-social/tests/**'
      - 'systera-social/requirements.txt'
permissions:
  contents: write
concurrency:
  group: systera-social
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-lato
      - run: python -m pip install -r systera-social/requirements.txt
      - name: Pruebas unitarias
        run: python -m pytest -q systera-social/tests
      - name: Ejecutar lote de forma segura
        env:
          RUN_PUBLISH: ${{ vars.RUN_PUBLISH || 'false' }}
          META_API_VERSION: v26.0
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          YOUTUBE_TARGET_CHANNEL_ID: ${{ secrets.YOUTUBE_TARGET_CHANNEL_ID }}
          YOUTUBE_CLIENT_SECRET_JSON_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_BASE64 }}
          YOUTUBE_OAUTH_TOKEN_JSON_BASE64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_BASE64 }}
        run: |
          cd systera-social
          if [ "${RUN_PUBLISH}" = "true" ]; then
            python src/social.py run --render --publish
          else
            python src/social.py run --render
          fi
      - name: Guardar registro sin secretos
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add systera-social/data/state.json
          git diff --cached --quiet || (git commit -m 'SysTera registro ciclo automático [skip ci]' && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systera-lote-${{ github.run_number }}
          path: |
            systera-social/output/**
          retention-days: 30
